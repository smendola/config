# MCP servers mirrored from ~/.config/opencode/opencode.jsonc.
# Re-synced 2026-10-28: opencode now enables asana, sentry, postman, sendgrid,
# context7 and solidcraft, with freecad disabled. Only the solidcraft row was
# updated here (allow-any-path, matching opencode); the other rows still carry
# the previous enable/disable state, so they remain known drift - see the
# profile README.
# asana: opencode uses OAuth (clientId/clientSecret/redirectUri), which
# dsh-mcp-client does not support in a configuration-only bundle; the row
# is kept disabled as a placeholder.
- insert:
  - id: mcp-context7
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: context7
      transport: streamable-http
      url: https://mcp.context7.com/mcp
      headers:
        Authorization: !!js '`Bearer ${process.env.CONTEXT7_API_KEY || ""}`'
      failOnStartupError: true

  - id: mcp-asana
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: asana
      transport: streamable-http
      url: https://mcp.asana.com/v2/mcp

  - id: mcp-sentry
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: sentry
      transport: streamable-http
      url: https://mcp.sentry.dev/mcp

  - id: mcp-postman
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: postman
      transport: streamable-http
      url: https://mcp.postman.com/minimal

  - id: mcp-sendgrid
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: sendgrid
      transport: stdio
      command: npx
      args: ['-y', 'sendgrid-mcp']
      env:
        SENDGRID_API_KEY: !!js (process.env.SENDGRID_API_KEY || "")
        READ_ONLY: 'false'
        REQUEST_TIMEOUT: '60000'

  - id: mcp-freecad
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: freecad
      transport: stdio
      command: /home/sal/miniconda3/bin/freecad-mcp
      cwd: /tmp/opencode
      env:
        FREECAD_MODE: 'xmlrpc'
        FREECAD_SOCKET_HOST: 'localhost'
        FREECAD_XMLRPC_PORT: '9875'

  - id: mcp-solidcraft
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: solidcraft
      transport: stdio
      command: /home/sal/.local/bin/solidcraft-cli
      # Mirror of opencode's entry (2026-10-28): [".../solidcraft-cli", "mcp",
      # "--allow-any-path"]. The old row passed two paths after a single
      # --allow-path; the CLI takes one DIR, so the second was silently dropped
      # and only ~/Documents/FreeCAD was reachable. --allow-any-path lifts the
      # limit, matching opencode.
      args:
        - mcp
        - '--allow-any-path'
      cwd: /home/sal/Documents/SolidCraft
